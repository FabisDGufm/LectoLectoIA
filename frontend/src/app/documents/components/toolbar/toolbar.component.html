<!-- Toolbar Component -->
<header class="toolbar" role="banner">
  <div class="toolbar-container">
    <!-- Logo y título -->
    <div class="toolbar-brand">
      <h1 class="toolbar-title">LectoLecto<span class="text-accent">IA</span></h1>
      <span class="toolbar-subtitle">Sistema de Lectura y Anotación</span>
    </div>

    <!-- Saludo dinámico con nombre de usuario -->
    <div class="toolbar-greeting">
      <span class="greeting-text">{{ greeting() }}</span>
    </div>

    <!-- Acciones de toolbar -->
    <div class="toolbar-actions">
      <!-- Botón de subir PDF -->
      <button
        type="button"
        class="btn btn-upload"
        (click)="openFileSelector()"
        [disabled]="isUploading()"
        title="Subir documento PDF">
        @if (isUploading()) {
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span>Subiendo...</span>
        } @else {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Subir PDF
        }
      </button>

      <!-- Input de archivo oculto -->
      <input
        #fileInput
        type="file"
        accept="application/pdf"
        (change)="onFileSelected($event)"
        style="display: none;"
        aria-label="Seleccionar archivo PDF"
      />

      <!-- Botón de modo oscuro -->
      <button
        type="button"
        class="btn btn-theme"
        (click)="toggleTheme()"
        [attr.aria-label]="getThemeLabel()"
        title="{{ getThemeLabel() }}">
        <span class="theme-label">{{ getThemeLabel() }}</span>
      </button>

      <!-- Botón de cerrar sesión -->
      <button
        type="button"
        class="btn btn-logout"
        (click)="authService.logout()"
        title="Cerrar sesión">
        Salir
      </button>
    </div>
  </div>
</header>
